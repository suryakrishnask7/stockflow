spring:
  application:
    name: stockflow-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockflow}
    username: ${DATABASE_USERNAME:stockflow}
    password: ${DATABASE_PASSWORD:stockflow123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
    default-property-inclusion: NON_NULL

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

stockflow:
  security:
    jwt-secret: ${JWT_SECRET:stockflow-super-secret-key-for-development-only-change-in-production-min-256-bits}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:900000}
    jwt-refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  inventory:
    allow-negative-stock: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: StockFlow API
    version: 1.0.0
    description: StockFlow Inventory Management Platform REST API

logging:
  level:
    com.stockflow: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
